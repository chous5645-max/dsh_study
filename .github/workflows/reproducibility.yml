name: reproducibility

on:
  push:
    branches: [main]
  pull_request:

jobs:
  windows-build:
    runs-on: windows-latest
    steps:
      - name: Check out workspace and DSH submodule
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Enable repository pnpm version
        shell: pwsh
        run: |
          corepack enable
          corepack prepare pnpm@11.7.0 --activate

      - name: Configure and verify repository topology
        shell: pwsh
        run: .\scripts\bootstrap.ps1 -SkipInstall -SkipBuild

      - name: Install DSH dependencies
        working-directory: source/deepseek-harness
        run: pnpm install --frozen-lockfile

      - name: Build DSH
        working-directory: source/deepseek-harness
        run: pnpm run build

      - name: Verify reproducible workspace
        shell: pwsh
        run: .\scripts\verify-environment.ps1 -RequireDependencies -RequireBuild
